name: newsapp
description: A community-driven news platform built with Flutter & Firebase.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_svg: ^2.0.10+1

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.1
  chewie: ^1.8.4
  photo_view: ^0.15.0

  # Utilities
  timeago: ^3.7.0
  uuid: ^4.5.1
  intl: ^0.19.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  infinite_scroll_pagination: ^4.0.0
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.2.0+3
  flutter_local_notifications: ^17.2.4

  # Forms & Validation
  reactive_forms: ^17.0.0

  # Misc
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
